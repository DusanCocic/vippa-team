<style>
:root{
  --c950:#051F20; --c900:#0B2B26; --c800:#163832; --c300:#8EB69B; --ink:#DAF1DE;
  --ink-2:rgba(218,241,222,.66); --line:rgba(142,182,155,.18); --line-2:rgba(142,182,155,.32);
  --glass:linear-gradient(160deg,rgba(35,83,71,.38),rgba(11,43,38,.32));
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--c950);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.page{position:relative;min-height:100vh;overflow:hidden}
.bg-hex{position:absolute;top:-120px;left:50%;width:620px;margin-left:-310px;pointer-events:none}
.wrap{position:relative;max-width:460px;margin:0 auto;padding:24px 20px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:24px}
.top{display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:10px;min-height:44px}
.brand span{font-size:19px;font-weight:500}
.label{font-size:11px;font-weight:500;letter-spacing:1.8px;text-transform:uppercase;color:var(--c300);margin:0}
.hero{display:flex;flex-direction:column;gap:22px;padding:28px 22px 24px;border-radius:28px;border:1px solid var(--line);background:var(--glass)}
.who{display:flex;align-items:center;gap:18px}
.hex{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.avatar{width:92px;height:106px;flex-shrink:0;background:var(--c300);display:flex;align-items:center;justify-content:center}
.avatar img{width:86px;height:99px;object-fit:cover;object-position:50% 40%;display:block}
.name{display:flex;flex-direction:column;gap:6px}
h1{margin:0;font-size:38px;font-weight:500;line-height:1;letter-spacing:-1.2px}
.roles{border-top:1px solid var(--line)}
.role{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.role b{font-size:16px;font-weight:500}
.role small{font-size:11px;font-weight:500;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-2)}
.btn-main{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 8px 0 24px;border-radius:999px;background:var(--ink);color:var(--c950);font-size:15px;font-weight:500;letter-spacing:.28px;transition:transform .15s}
.btn-main:active{transform:scale(.98)}
.btn-main i{width:40px;height:40px;border-radius:50%;background:var(--c950);display:flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:22px;border:1px solid var(--line);background:var(--c900);transition:border-color .2s}
.tile:hover,.tile:active{border-color:var(--line-2)}
.ico{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center}
.tile b{display:block;font-size:15px;font-weight:500}
.tile small{display:block;margin-top:3px;font-size:12px;color:var(--ink-2)}
.list{border-radius:22px;border:1px solid var(--line);background:var(--c900)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px}
.row+.row{border-top:1px solid var(--line)}
.row span{display:flex;flex-direction:column;gap:3px;font-size:15px;word-break:break-all}
.row em{font-style:normal;font-size:11px;font-weight:500;letter-spacing:1.6px;text-transform:uppercase;color:var(--c300)}
.section{display:flex;flex-direction:column;gap:12px}
.pill{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 22px;border-radius:999px;border:1px solid var(--line-2);font-size:16px;font-weight:500;transition:background .2s}
.pill:hover,.pill:active{background:var(--c900)}
.pill i{width:40px;height:40px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center}
.ig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ig a{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 6px;border-radius:22px;border:1px solid var(--line);background:var(--c900);text-align:center;font-size:12px;font-weight:500;word-break:break-all}
.foot{display:flex;align-items:center;justify-content:center;gap:10px;padding-top:8px}
svg.s{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
